spring:
  application:
    name: clinic
  profiles:
    # 本地默认 H2；服务器设置环境变量 SPRING_PROFILES_ACTIVE=prod 使用 MySQL
    active: dev

jwt:
  secret: your-256-bit-secret-key-here-must-be-at-least-32-characters
  expiration: 86400000

server:
  port: 8081
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
