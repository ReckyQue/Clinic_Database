groups:
  - name: api_alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API 错误率超过 1%"
          description: "5 分钟窗口 5xx 占比过高，请检查 canary 与日志"
